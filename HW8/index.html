<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Grid</title>
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <div class="row g-0">
      <div class="col-3 border border-info bg-info-subtle text-center">1</div>
      <div class="col-6 border border-info bg-danger text-center text-white">2</div>
      <div class="col-3 border border-info bg-info-subtle text-center">3</div>
    </div>
    <div class="row g-0">
      <div class="col-4 border border-info bg-info-subtle text-center">4</div>
      <div class="col-4 border border-info bg-warning text-center">5</div>
      <div class="col-4 border border-info bg-info-subtle text-center">6</div>
    </div>
    <div class="row g-0">
      <div class="col-5 border border-info bg-info-subtle text-center">7</div>
      <div class="col-2 border border-info bg-dark text-center text-white">8</div>
      <div class="col-5 border border-info bg-info-subtle text-center">9</div>
    </div>
  </main>
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
