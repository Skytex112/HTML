<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сітка блоків</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #41414e;
      font-family: Arial, sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      background: #3d4e8b;
    }

    .workspace {
      display: grid;
      grid-template-rows: 73px minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: #41414e;
    }

    .header {
      position: relative;
      background: #08a8c5;
    }

    .header::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 23px;
      border-bottom: 3px solid #aaa9ad;
      background: #41414e;
      content: "";
    }

    .grid {
      display: grid;
      grid-template-rows: 2.05fr 2.77fr 1fr;
      gap: 20px;
      min-width: 0;
      min-height: 0;
      padding: 20px 20px 0;
    }

    .top-row,
    .middle-row,
    .bottom-row,
    .stack {
      display: grid;
      gap: 20px;
      min-width: 0;
      min-height: 0;
    }

    .top-row {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .middle-row {
      grid-template-columns: 1.5fr 1.18fr 1fr;
    }

    .stack {
      grid-template-rows: repeat(2, minmax(0, 1fr));
    }

    .bottom-row {
      grid-template-columns: 2fr 3fr;
    }

    .block {
      min-width: 0;
      min-height: 0;
      background: #3d4e8b;
    }

    .block--accent {
      background: #08a8c5;
    }

    @media (max-width: 700px) {
      .page {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .workspace {
        grid-template-rows: 56px minmax(0, 1fr);
      }

      .header::after {
        height: 16px;
        border-bottom-width: 2px;
      }

      .grid,
      .top-row,
      .middle-row,
      .bottom-row,
      .stack {
        gap: 10px;
      }

      .grid {
        padding: 10px 10px 0;
      }

      .middle-row {
        grid-template-columns: 1.3fr 1fr 0.85fr;
      }
    }

    @media (max-height: 480px) {
      .grid {
        grid-template-rows: 1.7fr 2.3fr 1fr;
        gap: 10px;
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Сітка кольорових блоків">
    <aside class="sidebar" aria-hidden="true"></aside>
    <section class="workspace">
      <header class="header" aria-hidden="true"></header>
      <div class="grid" aria-hidden="true">
        <div class="top-row">
          <div class="block"></div>
          <div class="block"></div>
          <div class="block"></div>
          <div class="block"></div>
        </div>
        <div class="middle-row">
          <div class="block"></div>
          <div class="block"></div>
          <div class="stack">
            <div class="block"></div>
            <div class="block"></div>
          </div>
        </div>
        <div class="bottom-row">
          <div class="block block--accent"></div>
          <div class="block block--accent"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
