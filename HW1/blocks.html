<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #252525;
      font-family: Arial, sans-serif;
    }

    .gallery {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .feature {
      position: relative;
      display: flex;
      height: 190px;
      overflow: hidden;
      background: #f4f4f4;
      isolation: isolate;
    }

    .feature__text,
    .feature__image {
      width: 50%;
      height: 100%;
    }

    .feature__text {
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
    }

    .feature__text p {
      margin: 0;
    }

    .feature__image {
      overflow: hidden;
    }

    .feature__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1s ease;
    }

    .feature::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: rgb(0 0 0 / 50%);
      content: "";
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .feature:hover::after {
      opacity: 1;
    }

    .feature:hover .feature__image img {
      transform: scale(1.15);
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .feature {
        height: 155px;
      }

      .feature__text {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="gallery" aria-label="Блоки з текстом і зображенням">
    <section class="feature">
      <div class="feature__text"><p>HELLO, WORLD!</p></div>
      <div class="feature__image">
        <img src="leaves.svg" alt="Бірюзове листя на темному тлі">
      </div>
    </section>
    <section class="feature">
      <div class="feature__image">
        <img src="leaves.svg" alt="Бірюзове листя на темному тлі">
      </div>
      <div class="feature__text"><p>HELLO, WORLD!</p></div>
    </section>
    <section class="feature">
      <div class="feature__text"><p>HELLO, WORLD!</p></div>
      <div class="feature__image">
        <img src="leaves.svg" alt="Бірюзове листя на темному тлі">
      </div>
    </section>
  </main>
</body>
</html>
